services:
  - type: web
    name: monitor-aviator-api
    runtime: node
    rootDir: monitor-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: COLLECTOR_TOKEN
        generateValue: true
