name: Build AssistPro Monitor for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-monitor/**'
      - '.github/workflows/build-assistpro-monitor.yml'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-monitor/requirements.txt
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name AssistPro-Monitor --collect-all rapidocr_onnxruntime --collect-all onnxruntime desktop-monitor/monitor.py
      - name: Package
        run: Compress-Archive -Path dist/AssistPro-Monitor -DestinationPath AssistPro-Monitor-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AssistPro-Monitor-Windows
          path: AssistPro-Monitor-Windows.zip
          retention-days: 30
